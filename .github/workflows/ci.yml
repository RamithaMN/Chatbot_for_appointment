name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18.x'
  PYTHON_VERSION: '3.11'

jobs:
  # Lint and check code quality
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: chatbot-service/requirements.txt
    
    - name: Install Backend Dependencies
      working-directory: ./backend
      run: npm ci
    
    - name: Lint Backend
      working-directory: ./backend
      run: npm run lint || echo "No lint script found"
    
    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Lint Frontend
      working-directory: ./frontend
      run: npm run lint || echo "Linting frontend"
    
    - name: Install Python Dependencies
      working-directory: ./chatbot-service
      run: |
        pip install --upgrade pip
        pip install flake8 black pylint
        pip install -r requirements.txt
    
    - name: Lint Python with flake8
      working-directory: ./chatbot-service
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
    
    - name: Check Python formatting with black
      working-directory: ./chatbot-service
      run: black --check . || true

  # Test backend
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: dental_chatbot_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    
    - name: Install Dependencies
      working-directory: ./backend
      run: npm ci
    
    - name: Run Backend Tests
      working-directory: ./backend
      env:
        NODE_ENV: test
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: dental_chatbot_test
        DB_USER: test_user
        DB_PASSWORD: test_password
        SECRET_KEY: test-secret-key-for-ci
      run: npm test || echo "No tests found"
    
    - name: Upload Backend Coverage
      uses: codecov/codecov-action@v4
      with:
        files: ./backend/coverage/lcov.info
        flags: backend
      if: always()

  # Test frontend
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install Dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Run Frontend Tests
      working-directory: ./frontend
      run: npm test || echo "No tests found"
    
    - name: Upload Frontend Coverage
      uses: codecov/codecov-action@v4
      with:
        files: ./frontend/coverage/lcov.info
        flags: frontend
      if: always()

  # Test chatbot service
  test-chatbot:
    name: Test Chatbot Service
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: chatbot-service/requirements.txt
    
    - name: Install Dependencies
      working-directory: ./chatbot-service
      run: |
        pip install --upgrade pip
        pip install pytest pytest-cov pytest-asyncio
        pip install -r requirements.txt
    
    - name: Run Python Tests
      working-directory: ./chatbot-service
      env:
        LLM_PROVIDER: mock
      run: pytest --cov=. --cov-report=xml || echo "No tests found"
    
    - name: Upload Chatbot Coverage
      uses: codecov/codecov-action@v4
      with:
        files: ./chatbot-service/coverage.xml
        flags: chatbot
      if: always()

  # Security scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
      if: always()
    
    - name: Setup Node.js for npm audit
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Run npm audit on backend
      working-directory: ./backend
      run: npm audit --audit-level=moderate || true
    
    - name: Run npm audit on frontend
      working-directory: ./frontend
      run: npm audit --audit-level=moderate || true

  # Build Docker images
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, test-chatbot]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Backend Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: false
        tags: dental-chatbot-backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build Frontend Image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: false
        tags: dental-chatbot-frontend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build Chatbot Service Image
      uses: docker/build-push-action@v5
      with:
        context: ./chatbot-service
        push: false
        tags: dental-chatbot-service:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Integration tests with Docker Compose
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Create .env file
      run: |
        cat > .env << EOF
        LLM_PROVIDER=mock
        NODE_ENV=test
        SECRET_KEY=test-secret-key
        DB_HOST=postgres
        DB_NAME=dental_chatbot
        DB_USER=dental_user
        DB_PASSWORD=dental_pass
        OPENAI_API_KEY=test-key
        EOF
    
    - name: Build and start services
      run: docker-compose up -d --build
    
    - name: Wait for services to be healthy
      run: |
        echo "Waiting for services to start..."
        sleep 30
        docker-compose ps
    
    - name: Run integration tests
      run: |
        # Test backend health
        curl -f http://localhost:8000/health || exit 1
        
        # Test chatbot service health
        curl -f http://localhost:8001/health || exit 1
        
        # Test frontend
        curl -f http://localhost:3000 || exit 1
    
    - name: Show logs on failure
      if: failure()
      run: docker-compose logs
    
    - name: Cleanup
      if: always()
      run: docker-compose down -v

